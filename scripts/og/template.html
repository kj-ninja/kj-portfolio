<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      /* Local files only: the template never touches the network. latin-ext covers Polish diacritics. */
      @font-face {
        font-family: "Inter Tight Variable";
        font-weight: 100 900;
        src: url("../../node_modules/@fontsource-variable/inter-tight/files/inter-tight-latin-wght-normal.woff2") format("woff2-variations");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Inter Tight Variable";
        font-weight: 100 900;
        src: url("../../node_modules/@fontsource-variable/inter-tight/files/inter-tight-latin-ext-wght-normal.woff2") format("woff2-variations");
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      /* The hex colours approximate the tokens in src/styles/global.css (light theme):
         #f6f3ee = --surface, #1f2430 = --ink, #5f6472 = --muted, #c2410c = --accent.
         Update them together with those tokens. */
      html, body { margin: 0; }
      body {
        width: 1200px; height: 630px; box-sizing: border-box; padding: 72px;
        background: #f6f3ee; color: #1f2430;
        font-family: "Inter Tight Variable", ui-sans-serif, system-ui, sans-serif;
        display: flex; flex-direction: column; justify-content: space-between;
      }
      p { margin: 0; }
      .eyebrow { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 24px; letter-spacing: 0.08em; text-transform: uppercase; color: #5f6472; }
      h1 { margin: 0; font-size: 72px; line-height: 1.1; letter-spacing: -0.02em; font-weight: 600; max-width: 1000px; }
      h1 .accent { color: #c2410c; }
      .url { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 28px; color: #5f6472; }
    </style>
  </head>
  <body>
    <p class="eyebrow" data-en="Krzysztof Jakubiak · Frontend engineer" data-pl="Krzysztof Jakubiak · Frontend engineer"></p>
    <h1>
      <span class="accent" data-en="Interfaces" data-pl="Interfejsy">Interfaces</span><span data-en=" for products that use AI. Lab: interview concepts, taken apart." data-pl=" produktów, które używają AI. Lab: koncepty z rozmów rekrutacyjnych, rozebrane na części."> for products that use AI. Lab: interview concepts, taken apart.</span>
    </h1>
    <p class="url">krzysztofjakubiak.com</p>
    <script>
      const locale = new URLSearchParams(location.search).get("locale") === "pl" ? "pl" : "en";
      document.documentElement.lang = locale;
      for (const el of document.querySelectorAll("[data-en]")) el.textContent = el.dataset[locale];
    </script>
  </body>
</html>
