version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    ignore:
      # `astro check` (@astrojs/check) rejects TypeScript 7.0 ("install TypeScript 6 instead").
      # Revisit when Astro supports TS 7 (see @astrojs/ts-content-mapper for TS 7.1+).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Node types must match the Node major the site runs on (.nvmrc: 22). Newer majors describe
      # APIs Node 22 does not have, so the type check would accept code that fails at runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      tooling:
        patterns: ["@biomejs/biome", "typescript", "wrangler", "@playwright/test", "@axe-core/playwright"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
