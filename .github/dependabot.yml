version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      tooling:
        patterns: ["@biomejs/biome", "typescript", "wrangler", "@playwright/test", "@axe-core/playwright"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
